<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later. Viewer only: the catalogue data
     and art it loads are local proprietary references, generated by
     scripts/build-item-catalog.ps1 into the ignored outputs/ folder. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item Catalogue</title>
<style>
:root{--bg:#16130f;--panel:#211c16;--card:#2a241c;--line:#3d3428;--ink:#ece2cc;--dim:#a8977a;--accent:#d9a441;--ok:#6fb26b;--warn:#d07a3a;--check-a:#2b261f;--check-b:#332c23}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:18px;margin:0 0 2px;font-family:Georgia,serif;letter-spacing:.02em}
.notice{color:var(--warn);font-size:12px}
.stats{color:var(--dim);font-size:12px;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
input,select,button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font:inherit}
input[type=search]{min-width:220px;flex:1 1 220px;max-width:360px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:5px 0 0 5px}.seg button:last-child{border-radius:0 5px 5px 0}
.seg button.on{background:var(--accent);color:#1b150d;border-color:var(--accent)}
label.chk{display:inline-flex;gap:5px;align-items:center;color:var(--dim)}
main{padding:14px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,150px),1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:7px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover,.card:focus{border-color:var(--accent);outline:none}
.thumb{height:var(--thumb,120px);display:flex;align-items:flex-end;justify-content:center;padding:6px;
 background:repeating-conic-gradient(var(--check-a) 0 25%,var(--check-b) 0 50%) 0 0/16px 16px}
.thumb img{max-width:100%;max-height:100%;image-rendering:pixelated;object-fit:contain}
.meta{padding:6px 8px 8px}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}
.sub{color:var(--dim);font-size:12px;display:flex;justify-content:space-between;gap:6px}
.rank{color:var(--accent);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--dim);margin-top:4px}
.badge{--c:var(--dim);color:var(--c);border-color:var(--c)}
.s-scan{--c:#3fd08a}.s-crafted{--c:#8fc96b}.s-kit{--c:#a8b26b}.s-owner{--c:#5fb0c9}.s-built{--c:#c9b25f}.s-guess{--c:#d07a3a}.s-original{--c:#c95f5f}.s-hidden{--c:#7d7468}
.card.done{opacity:.55}.card.done:hover{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:12px;color:var(--dim)}
.legend b{font-weight:600;color:var(--c)}
#more{margin:18px auto;display:block;color:var(--dim)}
#detail{position:fixed;inset:0 0 0 auto;width:min(760px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:10;
 transform:translateX(100%);transition:transform .15s;overflow:auto;padding:16px}
#detail.open{transform:none}
#detail h2{margin:0 0 4px;font-family:Georgia,serif;text-transform:capitalize}
.close{position:sticky;top:0;float:right}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.member{background:var(--card);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.member .thumb{height:auto;min-height:140px;padding:10px}
.member .thumb img{max-height:none;max-width:100%}
.member dl{margin:0;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.member dt{color:var(--dim)}.member dd{margin:0;word-break:break-word}
.empty{color:var(--dim);padding:40px;text-align:center}
@media (max-width:600px){input[type=search]{max-width:none}}
</style>
</head>
<body>
<header>
 <h1>Original item catalogue</h1>
 <div class="notice">Local reference only: original Ultima Online artwork. Never commit, upload or redistribute.</div>
 <div class="stats" id="stats"></div>
 <div class="legend" id="legend"></div>
 <div class="controls">
  <span class="seg" id="view"><button data-v="families" class="on">Families</button><button data-v="items">Single items</button></span>
  <input type="search" id="q" placeholder="Search name, ID (1234 or 0x4D2), family…">
  <select id="cat"><option value="">All categories</option></select>
  <select id="sort">
   <option value="world">Most placed in the world</option>
   <option value="britain">Most placed in Britain</option>
   <option value="id">Item number</option>
  </select>
  <select id="look">
   <option value="">Any current look</option>
   <option value="todo" selected>Needs a model (original, guess, low-poly stand-in or plain code)</option>
   <option value="done">Done (photoscan, crafted, your packs)</option>
   <option value="scan">Photoscan / realistic</option>
   <option value="crafted">Crafted (photoscan materials)</option>
   <option value="original">Original only</option>
   <option value="guess">Untested guess</option>
   <option value="kit">Low-poly stand-in</option>
   <option value="owner">Your packs</option>
   <option value="built">Built in code</option>
  </select>
  <label class="chk"><input type="checkbox" id="placed" checked>Placed in the world only</label>
  <label class="chk"><input type="checkbox" id="brit">In Britain only</label>
  <label class="chk">Size <input type="range" id="size" min="100" max="260" value="150"></label>
  <button id="csv" title="Download the current list as CSV">Export list</button>
 </div>
</header>
<main><div class="grid" id="grid"></div><button id="more">Show more</button></main>
<aside id="detail" aria-hidden="true"></aside>
<script src="catalog.js"></script>
<script src="current.js"></script>
<script>
const C=window.CATALOG,byId=new Map(C.items.map(i=>[i.id,i])),PAGE=240;
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString();
let view='families',shown=0,list=[];
// Family rank by world placements (the owner's priority order), fixed regardless of filters.
C.families.forEach((f,i)=>f.rank=f.world>0?i+1:null);
const placedItems=C.items.filter(i=>i.world>0);placedItems.forEach((i,n)=>i.rank=n+1);
const famOf=new Map();C.families.forEach(f=>f.ids.forEach(id=>famOf.set(id,f)));
const cats=[...new Set(C.families.map(f=>f.category))].sort();
cats.forEach(c=>$('#cat').insertAdjacentHTML('beforeend',`<option>${c}</option>`));
$('#stats').textContent=`${fmt(C.items.length)} item graphics · ${fmt(placedItems.length)} placed in the world · ${fmt(C.families.length)} families (${fmt(C.families.filter(f=>f.world>0).length)} placed) · generated ${C.generated}`;
const art=id=>`art/${id}.png`;
// What this client draws today (current.js from Presentation/ArtProvenance.gd).
const LOOKS=(window.CURRENT||{}).looks||{},DONE=['scan','crafted','owner','hidden'];
const LABEL={scan:'Photoscan / realistic',crafted:'Crafted (photoscan materials)',owner:'Your packs',kit:'Low-poly stand-in',built:'Built in code',guess:'Untested guess',original:'Original only',hidden:'Not drawn'};
const look=id=>LOOKS[id]||{status:'original',detail:window.CURRENT?'no 3D look yet':'run build-item-catalog.ps1 to label'};
function status(item){const l=look(item.id);return [l.status,LABEL[l.status]]}
// A family's look: the status that covers most of its placements.
function famLook(f){const w={};f.ids.forEach(id=>{const i=byId.get(id),s=look(id).status;w[s]=(w[s]||0)+Math.max(i.world,f.world?0:1)});return Object.entries(w).sort((a,b)=>b[1]-a[1])[0][0]}
C.families.forEach(f=>{f.look=famLook(f);f.todo=f.ids.filter(id=>['original','guess','kit','built'].includes(look(id).status)&&byId.get(id).world>0).length});
C.items.forEach(i=>i.look=look(i.id).status);
function lookMatch(e,want){if(!want)return true;if(want==='todo')return ['original','guess','kit','built'].includes(e.look);if(want==='done')return DONE.includes(e.look);return e.look===want}
function lead(f){return f.ids.map(id=>byId.get(id)).sort((a,b)=>b.world-a.world||a.id-b.id)[0]}
function matches(text,entry,ids){
 if(!text)return true;const t=text.trim().toLowerCase();
 const n=/^0x[0-9a-f]+$/.test(t)?parseInt(t,16):/^\d+$/.test(t)?+t:null;
 if(n!==null)return ids.includes(n);
 return entry.name.includes(t)||(entry.key||entry.family||'').includes(t.replace(/\s+/g,'_'));
}
function compute(){
 const q=$('#q').value,cat=$('#cat').value,placed=$('#placed').checked,brit=$('#brit').checked,sort=$('#sort').value;
 const src=view==='families'?C.families:C.items;
 const want=$('#look').value;list=src.filter(e=>lookMatch(e,want)&&(!cat||e.category===cat)&&(!placed||e.world>0)&&(!brit||e.britain>0)&&matches(q,e,e.ids||[e.id]));
 const key=sort==='id'?e=>(e.ids?e.ids[0]:e.id):null;
 list.sort(key?(a,b)=>key(a)-key(b):(a,b)=>b[sort]-a[sort]||(a.ids?a.ids[0]:a.id)-(b.ids?b.ids[0]:b.id));
 shown=0;$('#grid').innerHTML='';render();
}
// Enlarge small originals by whole pixel multiples to fill the thumbnail.
function scaled(i){if(!i.art)return '';const cell=+$('#size').value,k=Math.max(1,Math.min(3,Math.floor(Math.min((cell-16)/i.art[0],(cell*.8-12)/i.art[1]))));return `width:${i.art[0]*k}px`}
function card(e){
 const fam=view==='families',item=fam?lead(e):e,st=[e.look,LABEL[e.look]];
 return `<div class="card${DONE.includes(e.look)?' done':''}" tabindex="0" data-k="${fam?e.key:e.id}">
  <div class="thumb"><img loading="lazy" src="${art(item.id)}" style="${scaled(item)}" alt=""></div>
  <div class="meta"><div class="name" title="${e.name}">${e.name}</div>
  <div class="sub"><span class="rank">${e.rank?'#'+fmt(e.rank):'—'}</span><span>${fmt(e.world)} placed</span></div>
  <div class="sub"><span>${fam?e.ids.length+' graphic'+(e.ids.length>1?'s':''):item.hex}</span></div>
  <div class="sub"><span>${e.category}</span></div>
  <span class="badge s-${st[0]}">${st[1]}</span>${fam&&e.britain?' <span class="badge">in Britain</span>':''}</div></div>`;
}
function render(){
 const next=list.slice(shown,shown+PAGE);shown+=next.length;
 $('#grid').insertAdjacentHTML('beforeend',next.map(card).join(''));
 if(!list.length)$('#grid').innerHTML='<div class="empty">Nothing matches.</div>';
 $('#more').style.display=shown<list.length?'block':'none';
 $('#more').textContent=`Show more (${fmt(list.length-shown)} left)`;
}
function facets(i){return Object.entries(i.facets||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${fmt(v)}`).join(', ')||'not placed'}
function member(i){
 const st=status(i);
 return `<div class="member"><div class="thumb"><img src="${art(i.id)}" style="width:${(i.art?i.art[0]:44)*2}px" alt=""></div><dl>
  <dt>Item</dt><dd><b>${i.id}</b> · ${i.hex} <button data-copy="${i.id}">copy</button></dd>
  <dt>Placed</dt><dd>${fmt(i.world)} in the world${i.felucca?` (+${fmt(i.felucca)} Felucca)`:''}${i.britain?`, ${fmt(i.britain)} in Britain`:''}</dd>
  <dt>Where</dt><dd>${facets(i)}</dd>
  ${i.example?`<dt>Example</dt><dd>${i.example}</dd>`:''}
  <dt>Height</dt><dd>${i.height} · weight ${i.weight}${i.art?` · art ${i.art[0]}×${i.art[1]} px`:''}</dd>
  ${i.layer?`<dt>Worn</dt><dd>${i.layer}${i.anim?` · animation ${i.anim}`:''}</dd>`:''}
  <dt>Flags</dt><dd>${i.flags.join(', ')||'none'}</dd>
  <dt>Now</dt><dd><span class="badge s-${st[0]}">${st[1]}</span> ${look(i.id).detail}</dd></dl></div>`;
}
function open(k){
 const f=/^\d+$/.test(k)?famOf.get(+k):C.families.find(x=>x.key===k);if(!f)return;
 const members=f.ids.map(id=>byId.get(id)).sort((a,b)=>b.world-a.world||a.id-b.id);
 const d=$('#detail');
 d.innerHTML=`<button class="close" id="x">Close (Esc)</button><h2>${f.name}</h2>
  <div class="stats">Family <code>${f.key}</code> · ${f.category} · rank ${f.rank?'#'+fmt(f.rank):'not placed'} · ${fmt(f.world)} placed in the world${f.britain?`, ${fmt(f.britain)} in Britain`:''} · ${f.ids.length} graphic${f.ids.length>1?'s':''} (${f.ids[0]}–${f.ids[f.ids.length-1]})</div>
  <div class="members">${members.map(member).join('')}</div>`;
 history.replaceState(null,'','#'+f.key);
 d.classList.add('open');d.setAttribute('aria-hidden','false');d.scrollTop=0;
 $('#x').onclick=closeDetail;
}
function closeDetail(){history.replaceState(null,'',location.pathname);$('#detail').classList.remove('open');$('#detail').setAttribute('aria-hidden','true')}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)open(c.dataset.k)});
$('#grid').addEventListener('keydown',e=>{const c=e.target.closest('.card');if(c&&e.key==='Enter')open(c.dataset.k)});
$('#detail').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){navigator.clipboard?.writeText(b.dataset.copy);b.textContent='copied'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
$('#view').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;[...$('#view').children].forEach(x=>x.classList.toggle('on',x===b));compute()});
let timer;$('#q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(compute,150)});
['#look','#cat','#sort','#placed','#brit'].forEach(s=>$(s).addEventListener('change',compute));
$('#size').addEventListener('change',compute);
$('#size').addEventListener('input',e=>{document.body.style.setProperty('--cell',e.target.value+'px');document.body.style.setProperty('--thumb',Math.round(e.target.value*.8)+'px')});
$('#more').onclick=render;
new IntersectionObserver(es=>{if(es[0].isIntersecting&&shown<list.length)render()},{rootMargin:'600px'}).observe($('#more'));
$('#csv').onclick=()=>{
 const rows=[['rank','family','name','category','placed_world','placed_britain','graphics','ids']].concat(list.map(e=>e.ids?[e.rank||'',e.key,e.name,e.category,e.world,e.britain,e.ids.length,e.ids.join(' ')]:[e.rank||'',e.family,e.name,e.category,e.world,e.britain,1,e.id]));
 const blob=new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`item-catalogue-${view}.csv`;a.click();
};
{const totals={};C.items.forEach(i=>{if(i.world>0)totals[i.look]=(totals[i.look]||0)+i.world});const all=Object.values(totals).reduce((a,b)=>a+b,0)||1;
 $('#legend').innerHTML=Object.keys(LABEL).filter(k=>totals[k]).map(k=>`<span class="s-${k}"><b>${LABEL[k]}</b> ${(100*totals[k]/all).toFixed(1)}% of placements</span>`).join('')+(window.CURRENT?'':' <span class="s-guess"><b>current.js missing</b></span>');}
compute();
if(location.hash.length>1)open(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
