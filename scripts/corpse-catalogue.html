<!doctype html>
<!-- GPL-3.0-or-later. Data/art generated locally under ignored outputs/. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadaver graphics • Britannia Reborn</title>
<style>body{margin:24px;background:#161c23;color:#e8e2d6;font:15px system-ui}h1{font:28px Georgia}p{max-width:1000px;color:#b8c3ce}input{padding:10px;width:min(500px,90%);background:#25333f;color:white;border:1px solid #586576}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px;margin-top:20px}article{background:#25313b;border:1px solid #465561;border-radius:8px;padding:12px}img{width:100%;aspect-ratio:4/3;object-fit:contain}small{color:#b2c4d4}code{color:#edd58f}a{color:#a3d4f4}</style>
<h1>Cadaver graphics</h1><p>Every available body has a still cadaver built from its final death pose. Graphic <code>0x2006</code> (8198) selects a variant using <b>amount = body ID</b>. The server supplies colour and facing. Client compatibility entries are labelled; this list does not change which creatures leave a corpse.</p>
<p id="stats"></p><input id="q" type="search" placeholder="Search creature, human, body ID or graphic ID" aria-label="Search corpse graphics"><main></main>
<script src="catalogue.js"></script><script>
const entries=window.CORPSES?.entries||[],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#stats').textContent=`${entries.length} body variants · ${window.CORPSES.checks} checks · ${window.CORPSES.failures} failures · local reference art`;
function render(){const q=document.querySelector('#q').value.trim().toLowerCase(),n=/^0x[0-9a-f]+$/.test(q)?parseInt(q,16):/^\d+$/.test(q)?+q:null;document.querySelector('main').innerHTML=entries.filter(e=>!q||(n!==null?[e.body,e.graphic].includes(n):e.name.toLowerCase().includes(q))).map(e=>`<article>${e.preview?`<a href="${esc(e.preview)}"><img loading="lazy" src="${esc(e.preview)}" alt="${esc(e.name)}"></a>`:''}<b>${esc(e.name)}</b><p>Graphic <code>${e.hex}</code> / ${e.graphic}<br>Body / amount <code>${e.body_hex}</code> / ${e.body}</p><small>${esc(e.provider)}${e.compatibility?' · client compatibility':''}${e.death_clip?' · '+esc(e.death_clip):''}</small></article>`).join('')};document.querySelector('#q').oninput=render;render();
</script></html>
